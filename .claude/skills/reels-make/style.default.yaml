# Default edit rules for /reels-make (정보형, dark). Copy to .claude/instagram/style.yaml and edit values, keep keys.
# Info reels use plan "layout": "mixed"; humor reels use "layout": "full" (captions only).
source:
  - "정보형 기본 스타일: 장면마다 얼굴 전체 / 위 그래픽 아래 얼굴 / 그래픽 전체가 2~5초 단위로 바뀜, 자막은 화면 가운데 이음선, 박스 없는 흰 글씨 + 검은 테두리, 강조 문장은 노란색"
  - "그래픽은 글을 다시 쓰지 않고 말에 나오는 대상(소품, 도식, 해부학 화면)을 보여줌"
  - "어두운 바탕: 빨강 = 긴장·통증·강조, 파랑 = 늘어남·약해짐"

canvas: {w: 1080, h: 1920, fps: 30}
font: Pretendard

colors:
  bg: "#07090d"          # 거의 검정. 해부학 클립과 이어짐
  panel: "#121620"       # 비교 상자 등 면
  ink: "#f4f6fa"
  muted: "#8a93a3"
  accent: "#ff4d5e"      # 빨강: 긴장, 통증, 강조 막대
  accent2: "#38b6ff"     # 파랑: 늘어남, 약해짐
  caption_bg: "#000000"  # box: false라 쓰지 않음
  caption_ink: "#ffffff"
  caption_accent: "#ffd23f"  # 강조 문장 노랑 (기준 영상)

layout:
  split_y: 960           # 기준 영상: 정확히 반반

caption:
  y_split: 960
  y_full: 1400           # 웃긴형 전체 화면: 아래쪽
  y_mixed: 960           # 정보형: 이음선에 고정 (기준 영상)
  size: 64
  weight: 800
  min_words: 1
  max_words: 3           # 기준 영상: 한 번에 2~5단어, 한국어 어절로 1~3
  box: false
  stroke: true           # 흰 글씨 + 검은 테두리

motion:
  card_rise_px: 40
  ease: expo.out
  in_dur: 0.45
  stagger: 0.1
  face_push_frames: 8    # 얼굴 장면 시작마다 빠르게 확대
  face_push_scale: 1.08
  layout_dur: 0.45       # 얼굴 전체 <-> 반반 <-> 그래픽 전체가 바뀔 때 미끄러지는 시간
  layout_ease: power2.inOut

cut:
  pad: 0.12
  max_gap: 0.35

sfx:
  scene: whoosh
  item: pop
  volume: 0.28

voice:
  provider: elevenlabs
  voice_id: JBFqnCBsd6RMkjVDRZzb   # A 계정은 AI 목소리를 쓰지 않음. B 계정용 기본값
  speed: 1.05
