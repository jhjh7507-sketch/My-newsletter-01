<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이번 주 AI 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
  img{max-width:100%}
  [hidden]:not([hidden=until-found i]){display:none!important}

  :root{
    --bg:#fbfaf7; --surface:#ffffff; --surface-2:#f4f2ec; --surface-3:#ece9e0;
    --text:#33312b; --text-2:#615d52; --text-3:#8e897b;
    --border:rgba(30,26,16,.10); --border-strong:rgba(30,26,16,.18);
    --accent:#2d6fc5;
    --shadow-sm:0 1px 2px rgba(30,26,16,.06); --shadow-md:0 6px 20px rgba(30,26,16,.09);
    --radius-sm:5px; --radius:8px; --radius-lg:14px;
    --tint-blue:#2d6dc4;    --tint-blue-bg:#e2ecf8;
    --tint-green:#2f8f5b;   --tint-green-bg:#e0f0e4;
    --tint-orange:#b5602a; --tint-orange-bg:#f5e7d8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18181a; --surface:#1e1e21; --surface-2:#232326; --surface-3:#2b2b2e;
      --text:#ece9e2; --text-2:#c3beb2; --text-3:#8f897c;
      --border:rgba(255,251,240,.10); --border-strong:rgba(255,251,240,.18);
      --accent:#8aa9ff;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 26px rgba(0,0,0,.4);
      --tint-blue:#7fa4f2;   --tint-blue-bg:#233047;
      --tint-green:#6bc793;  --tint-green-bg:#1f3327;
      --tint-orange:#e0a06b; --tint-orange-bg:#3a2c1d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18181a; --surface:#1e1e21; --surface-2:#232326; --surface-3:#2b2b2e;
    --text:#ece9e2; --text-2:#c3beb2; --text-3:#8f897c;
    --border:rgba(255,251,240,.10); --border-strong:rgba(255,251,240,.18);
    --accent:#8aa9ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 26px rgba(0,0,0,.4);
    --tint-blue:#7fa4f2;   --tint-blue-bg:#233047;
    --tint-green:#6bc793;  --tint-green-bg:#1f3327;
    --tint-orange:#e0a06b; --tint-orange-bg:#3a2c1d;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
    padding-inline:16px;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  p{margin:0}

  .topnav{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    display:flex; align-items:center; gap:10px;
    margin-inline:-16px; padding:12px 16px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:saturate(1.6) blur(10px);
    -webkit-backdrop-filter:saturate(1.6) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topnav__brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;letter-spacing:-.01em}
  .topnav__dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .topnav__spacer{flex:1}
  .theme-btn{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--border); color:var(--text-2);
  }
  .theme-btn:hover{background:var(--surface-2)}
  .theme-btn svg{width:16px;height:16px}
  .theme-btn .i-moon{display:none}
  :root[data-theme="dark"] .theme-btn .i-sun{display:none}
  :root[data-theme="dark"] .theme-btn .i-moon{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme-btn .i-sun{display:none}
    :root:not([data-theme="light"]) .theme-btn .i-moon{display:block}
  }

  .page{max-width:640px;margin-inline:auto}

  .head{padding-block:34px 22px}
  .head__eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--text-3);
    text-transform:uppercase;
  }
  .head__eyebrow .chip{
    padding:2px 8px;border-radius:999px;border:1px solid var(--border-strong);
    color:var(--text-2); font-weight:600; letter-spacing:0; text-transform:none;
    font-size:11px;
  }
  .head__title{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.18;margin-top:10px}
  .head__title b{color:var(--accent);font-weight:900}
  .head__lead{margin-top:9px;font-size:15.5px;color:var(--text-2);max-width:46ch}
  .head__meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-3)}
  .head__meta span{display:inline-flex;align-items:center;gap:5px}
  .head__greet{
    margin-top:18px;padding:13px 15px;border-radius:var(--radius);
    background:var(--surface-2);border:1px solid var(--border);
    font-size:13.5px;color:var(--text-2);
  }

  .tabs{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 49px); z-index:20;
    display:flex;gap:6px;overflow-x:auto;
    margin-inline:-16px;padding:9px 16px;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    --tc:var(--text-3); --tcb:var(--surface-2);
    flex:none; display:flex;align-items:center;gap:7px;
    padding:8px 13px;border-radius:999px;border:1px solid var(--border);
    font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--tc)}
  .tab[aria-selected="true"]{background:var(--tcb); border-color:transparent; color:var(--tc)}
  .tab.t-blue{--tc:var(--tint-blue);--tcb:var(--tint-blue-bg)}
  .tab.t-green{--tc:var(--tint-green);--tcb:var(--tint-green-bg)}
  .tab.t-orange{--tc:var(--tint-orange);--tcb:var(--tint-orange-bg)}

  .panel{padding-block:24px 20px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .panel[hidden]{display:none}
  .panel.t-blue{--tc:var(--tint-blue);--tcb:var(--tint-blue-bg)}
  .panel.t-green{--tc:var(--tint-green);--tcb:var(--tint-green-bg)}
  .panel.t-orange{--tc:var(--tint-orange);--tcb:var(--tint-orange-bg)}

  .panel__head{display:flex;align-items:baseline;gap:9px}
  .panel__icon{font-size:19px}
  .panel__title{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .panel__desc{margin-top:6px;font-size:13.5px;color:var(--text-2);max-width:52ch}

  details.criteria{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  details.criteria summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
    padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--text-2);
  }
  details.criteria summary::-webkit-details-marker{display:none}
  details.criteria summary::after{content:"▾"; margin-left:auto; color:var(--text-3); font-size:11px; transition:transform .15s}
  details.criteria[open] summary::after{transform:rotate(180deg)}
  .criteria__body{padding:0 12px 12px;font-size:12.5px;color:var(--text-3);line-height:1.6}

  .hl{margin-top:16px;padding:22px 20px;border-radius:var(--radius-lg);background:var(--tcb);border:1px solid var(--tc)}
  .hl__kicker{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:999px;border:1px solid var(--tc);color:var(--tc);
    font-size:11px;font-weight:800;letter-spacing:.02em;
  }
  .hl__title{margin-top:11px;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.34}
  .hl__summary{margin-top:9px;font-size:14.5px;color:var(--text-2);line-height:1.65}
  .hl__src{margin-top:13px;font-size:12px;color:var(--text-3)}
  .hl__src a{color:var(--tc);border-bottom:1px dashed var(--tc);text-decoration:none}

  .more-btn{margin-top:11px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--tc)}
  .more-btn .chev{font-size:10px;transition:transform .15s}
  .more-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .detail{display:none;margin-top:10px;font-size:13.5px;color:var(--text-2);line-height:1.72}
  .detail.open{display:block;animation:fade .18s ease}
  .detail p+p{margin-top:8px}

  .foryou{
    display:flex;gap:9px;margin-top:14px;padding:10px 13px;
    background:var(--surface);border-left:3px solid var(--tc);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  }
  .hl .foryou{background:var(--surface)}
  .foryou__label{flex:none;font-size:10.5px;font-weight:800;color:var(--tc);padding-top:1px}
  .foryou__text{font-size:12.8px;color:var(--text)}

  .more-label{margin-top:22px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
  .grid{margin-top:10px;display:grid;gap:11px}
  .card{padding:15px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .card__meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3)}
  .tag{padding:1.5px 8px;border-radius:999px;background:var(--tcb);color:var(--tc);font-size:10.5px;font-weight:800}
  .card__dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
  .src{color:var(--text-2);border-bottom:1px dashed var(--border-strong);text-decoration:none}
  .src:hover{color:var(--tc);border-color:var(--tc)}
  .card__title{margin-top:8px;font-size:15px;font-weight:700;letter-spacing:-.005em;line-height:1.42}
  .card__summary{margin-top:5px;font-size:13px;color:var(--text-2);line-height:1.6}

  .foot{margin-top:30px;padding-block:22px 44px;border-top:1px solid var(--border)}
  .foot__next{font-size:13px;font-weight:700;color:var(--text-2)}
  .foot__note{margin-top:8px;font-size:11.8px;color:var(--text-3);line-height:1.65;max-width:52ch}

  .archive-link{margin-top:14px}
  .archive-link a{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}

  @media (max-width:480px){
    .head__title{font-size:28px}
    .hl{padding:18px 16px}
    .hl__title{font-size:18px}
  }
</style>
</head>
<body>

<header class="topnav">
  <div class="topnav__brand"><span class="topnav__dot"></span><span id="brandTitle"></span></div>
  <div class="topnav__spacer"></div>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="테마 전환">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 10.5Z"/></svg>

</header>

<main class="page">
  <section class="head">
    <div class="head__eyebrow">🗞️ 주간 뉴스레터 <span class="chip" id="badgeChip"></span></div>
    <h1 class="head__title" id="titleEl"></h1>
    <p class="head__lead" id="leadEl"></p>
    <div class="head__meta">
      <span>📅 <span id="dateEl"></span></span>
      <span>✍️ 큐레이션 · Claude</span>
      <span>👤 <span id="authorEl"></span></span>
    </div>
    <p class="head__greet" id="greetEl"></p>
    <p class="archive-link"><a href="../index.html">← 지난 호 모아보기</a></p>
  </section>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="panels"></div>

  <footer class="foot">
    <p class="foot__next">📬 다음 호는 다음 주 이맘때 찾아옵니다.</p>
    <p class="foot__note">이 뉴스레터는 Claude가 공개된 자료를 바탕으로 선별·요약했습니다. AI의 판단은 출발점일 뿐이니, 중요한 내용은 원문 링크에서 다시 확인해 주세요.</p>
  </footer>
</main>

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function trustedHtml(s){ return s || ""; }

  function moreBtnHtml(){
    return '<button class="more-btn" type="button" aria-expanded="false">' +
      '<span class="t">자세히 보기</span><span class="chev">▾</span></button>';
  }

  function highlightHtml(h){
    return (
      '<section class="hl">' +
        '<span class="hl__kicker">⭐ ' + esc(h.kicker) + '</span>' +
        '<h2 class="hl__title">' + esc(h.title) + '</h2>' +
        '<p class="hl__summary">' + esc(h.summary) + '</p>' +
        (h.detail ? moreBtnHtml() + '<div class="detail">' + trustedHtml(h.detail) + '</div>' : '') +
        '<div class="hl__src">🔗 출처: <a href="' + esc(h.url) + '" target="_blank" rel="noopener">' + esc(h.source) + ' ↗</a> · 🗓 발행 ' + esc(h.published) + '</div>' +
        '<div class="foryou"><span class="foryou__label">✨ 나를 위한 한 줄</span><span class="foryou__text">' + esc(h.foryou) + '</span></div>' +
      '</section>'
    );
  }

  function cardHtml(a){
    return (
      '<article class="card">' +
        '<div class="card__meta">' +
          '<span class="tag">' + esc(a.tag) + '</span><span class="card__dot"></span>' +
          '<a class="src" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.source) + ' ↗</a>' +
          '<span class="card__dot"></span><span>' + esc(a.time) + '</span>' +
          '<span class="card__dot"></span><span>🗓 발행 ' + esc(a.published) + '</span>' +
        '</div>' +
        '<h4 class="card__title">' + esc(a.title) + '</h4>' +
        '<p class="card__summary">' + esc(a.summary) + '</p>' +
        (a.detail ? moreBtnHtml() + '<div class="detail">' + trustedHtml(a.detail) + '</div>' : '') +
        '<div class="foryou"><span class="foryou__label">✨ 나를 위한 한 줄</span><span class="foryou__text">' + esc(a.foryou) + '</span></div>' +
      '</article>'
    );
  }

  function panelHtml(topic, i){
    var arts = topic.articles.map(cardHtml).join("");
    return (
      '<div class="panel t-' + topic.tint + '" id="panel-' + topic.id + '" role="tabpanel" aria-labelledby="tab-' + topic.id + '"' + (i === 0 ? '' : ' hidden') + '>' +
        '<div class="panel__head"><span class="panel__icon">' + topic.icon + '</span><h3 class="panel__title">' + esc(topic.label) + '</h3></div>' +
        '<p class="panel__desc">' + esc(topic.desc) + '</p>' +
        '<details class="criteria"><summary>이렇게 골랐어요</summary><p class="criteria__body">' + esc(topic.criteria) + '</p></details>' +
        highlightHtml(topic.highlight) +
        '<div class="more-label">더 읽을거리</div>' +
        '<div class="grid">' + arts + '</div>' +
      '</div>'
    );
  }

  function tabHtml(topic, i){
    return (
      '<button class="tab t-' + topic.tint + '" id="tab-' + topic.id + '" data-target="panel-' + topic.id + '" ' +
      'role="tab" aria-selected="' + (i === 0 ? 'true' : 'false') + '" aria-controls="panel-' + topic.id + '">' +
        '<span class="dot"></span>' + topic.icon + ' ' + esc(topic.label) +
      '</button>'
    );
  }

  document.getElementById("brandTitle").textContent = "이번 주 AI 브리핑";
  document.getElementById("badgeChip").textContent = META.badge;
  document.getElementById("titleEl").innerHTML = META.title;
  document.getElementById("leadEl").textContent = META.lead;
  document.getElementById("dateEl").textContent = META.date;
  document.getElementById("authorEl").textContent = META.author;
  document.getElementById("greetEl").textContent = META.greet;

  var tabsEl = document.getElementById("tabs");
  var panelsEl = document.getElementById("panels");
  tabsEl.innerHTML = NEWSLETTER.topics.map(tabHtml).join("");
  panelsEl.innerHTML = NEWSLETTER.topics.map(panelHtml).join("");

  tabsEl.addEventListener("click", function(e){
    var btn = e.target.closest(".tab");
    if (!btn) return;
    tabsEl.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", String(t === btn)); });
    panelsEl.querySelectorAll(".panel").forEach(function(p){
      p.hidden = (p.id !== btn.dataset.target);
    });
  });

  panelsEl.addEventListener("click", function(e){
    var b = e.target.closest(".more-btn");
    if (!b) return;
    var open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    var d = b.nextElementSibling;
    if (d && d.classList.contains("detail")) d.classList.toggle("open", !open);
    var t = b.querySelector(".t");
    if (t) t.textContent = open ? "자세히 보기" : "접기";
  });

  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  function getStored(){ try{ return localStorage.getItem("nl-theme"); }catch(e){ return null; } }
  function apply(v){
    if (v === "light" || v === "dark") root.setAttribute("data-theme", v);
    else root.removeAttribute("data-theme");
  }
  apply(getStored());
  themeBtn.addEventListener("click", function(){
    var mql = window.matchMedia("(prefers-color-scheme: dark)");
    var current = getStored() || (mql.matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";
    try{ localStorage.setItem("nl-theme", next); }catch(e){}
    apply(next);
  });
})();
</script>
